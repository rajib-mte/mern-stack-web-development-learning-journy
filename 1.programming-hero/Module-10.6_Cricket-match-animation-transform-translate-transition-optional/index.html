<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cricket animation</title>
    <style>
      .field {
        margin: 500px;
        padding-top: 500px;
        border: 1px solid steelblue;
      }
      .bat {
        width: 40%;
        transform: scale(-1, 1);
        transition: transform 2s;
      }

      .ball {
        height: 40px;
        width: 40px;
        border-radius: 50%;
        background-color: red;
        position: relative;
        left: 300px;
        bottom: 200px;
        transition: transform 1s ease-out 1s;
      }

      .field:hover .bat {
        transform: rotate(-1deg) scale(-1, 1);
        transform-origin: top right;
      }
      .field:hover .ball {
        transform: translate(500px, -300px);
      }
    </style>
  </head>
  <body>
    <div class="field">
      <img class="bat" src="images/pngimg.com - cricket_PNG69.png" alt="" />
      <div class="ball"></div>
    </div>
  </body>
</html>
