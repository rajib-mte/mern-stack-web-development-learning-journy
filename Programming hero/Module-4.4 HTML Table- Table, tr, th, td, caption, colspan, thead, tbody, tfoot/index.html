<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <style>
        table{
            border-collapse: collapse;
        }
        td, th{
            border: 1px solid black;
            padding: 20px;
        }
    </style>
</head>
<body>
    <main>
        <h2>Friends</h2>
        <table>
            <caption>Friends List</caption>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>John</td>
                    <td>john@example.com</td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>Mary</td>
                    <td>mary@example.com</td>
                </tr>
                <tr>
                    <td>3</td>
                    <td>Mike</td>
                    <td>mike@example.com</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="3">Total Friends: 3</td>
                </tr>
            </tfoot>
        </table>
    </main>

    <section>
        <h2>Table Info</h2>
        <ul>
            <li>Table: table</li>
            <li>Table Head: thead</li>
            <li>Table Body: tbody</li>
            <li>Table Foot: tfoot</li>
            <li>Table Row: tr</li>
            <li>Table data: td</li>
        </ul>


    </section>

</body>
</html>
