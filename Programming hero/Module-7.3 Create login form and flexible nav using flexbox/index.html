<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form</title>
    <style>
      nav {
        display: flex;
        justify-content: space-between;
      }
      nav a {
        text-decoration: none;
        color: black;
        /* display: flex; */
      }
      .login-form-container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 90vh;
        /* border: 1px solid red; */
      }
      .login-form {
        display: flex;
        flex-direction: column;
        justify-content: center;
        /* border: 2px solid rebeccapurple; */
        width: 50%;
      }
      .login-form input {
        margin-top: 20px;
        padding: 20px;
      }
    </style>
  </head>
  <body>
    <nav>
      <div>
        <a href="">Home</a>
        <a href="">Profile</a>
        <a href="">Blog</a>
        <a href="">About</a>
      </div>
      <a href="">Login</a>
    </nav>
    <section class="login-form-container">
      <form class="login-form">
        <h3>Please Login</h3>
        <input type="email" name="" id="" placeholder="Your email" required />
        <input type="password" name="" id="" placeholder="Your name" required />
        <input type="submit" value="Login" />
      </form>
    </section>
  </body>
</html>
