<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Use var and calc</title>
    <style>
      :root {
        --primary-color: steelblue;
        --secondary-color: rgb(228, 106, 218);
        --font-size: 20px;
      }
      h1 {
        color: var(--primary-color);
      }
      h5 {
        background-color: var(--secondary-color);
      }
      .box {
        border: 2px solid steelblue;
        width: calc(100% - 300px);
      }
      .box p {
        color: steelblue;
      }
      .sidebar {
        background-color: lightgray;
      }

      .content {
        background-color: lightskyblue;
      }
      .container {
        display: grid;
        gap: 20px;
        grid-template-rows: 500px;
        grid-template-columns: 200px calc(100% - 200px - 20px);
      }
    </style>
  </head>
  <body>
    <h1>My Custom properties</h1>
    <h5>Also commonly know as CSS</h5>
    <div class="box">
      <h3>I am doing something</h3>
      <p>
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Alias, quos.
        Impedit aut quod sunt quae quos explicabo, delectus illum ex?
      </p>
    </div>
    <div class="container">
      <div class="sidebar">sidebar</div>
      <div class="content">Main content</div>
    </div>
  </body>
</html>
